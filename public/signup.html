<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up - Kenya Agro-Advisory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Kenya Agro-Advisory</h1><nav id="nav"></nav></header>
  <main class="auth">
    <h2>Sign up</h2>
    <form id="authForm" data-action="/api/signup">
      <label>Full name <input type="text" name="name" required maxlength="60" autocomplete="name"></label>
      <label>Email <input type="email" name="email" required autocomplete="email"></label>
      <label>Password <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <button type="submit" class="primary">Sign up</button>
    </form>
    <p id="msg" class="error" role="alert"></p>
    <p>Already registered? <a href="/login.html">Log in</a></p>
  </main>
  <script src="common.js"></script>
  <script src="auth.js"></script>
</body>
</html>
