<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Kenya Agro-Advisory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Kenya Agro-Advisory</h1><nav id="nav"></nav></header>
  <main>
    <h2 id="welcome"></h2>
    <p id="error" class="error" role="alert"></p>

    <!-- Shown to farmers only -->
    <section id="farmerView" hidden>
      <label class="consent"><input type="checkbox" id="consent"> I consent to my farm details being processed in this prototype.</label>
      <form id="adviceForm">
        <label>Crop <select name="crop" id="crop"></select></label>
        <label>County <select name="county" id="county"></select></label>
        <label>Agro-ecological zone <select name="zone" id="zone"></select></label>
        <label>Soil type <select name="soil" id="soil"></select></label>
        <label>Farming stage <select name="stage" id="stage"></select></label>
        <button type="submit" class="primary">Check advice</button>
      </form>
      <div id="result" aria-live="polite"></div>
      <h2>My advisories</h2>
      <div id="history"></div>
    </section>

    <!-- Shown to extension officers only -->
    <section id="officerView" hidden>
      <h3>Advice waiting for your review</h3>
      <div id="queue"></div>
    </section>
  </main>
  <script src="common.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
